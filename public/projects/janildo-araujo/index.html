<style>
:root{
  --bg:#0a1628;--bg2:rgba(13,28,50,0.68);--bg3:rgba(17,30,53,0.78);
  --border:rgba(255,255,255,0.08);--bhi:rgba(184,149,106,0.32);
  --gold:#C9A96E;--gold2:#DFC08A;--gd:rgba(184,149,106,0.10);--gg:rgba(184,149,106,0.18);
  --rose:#C45C7A;--green:#157A3B;
  --text:#F0F2F5;--muted:#8A9BB5;--dim:rgba(240,242,245,0.35);
  --r:14px;--rs:10px;--rp:999px;
  --fd:"Outfit",sans-serif;--fb:"Inter",sans-serif;
  --max:1340px;--px:72px;--pxm:20px;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;overflow-x:hidden;}

body{
  background-color:#0c1a2f;
  background-image:url("bg-texture.png");
  background-repeat:repeat;
  background-size:553px 677px;
  background-attachment:scroll;
  color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.65;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}

/* SUBTLE VIGNETTE SO THE TEXTURE IS FULLY VISIBLE */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 90% 80% at 50% 30%, transparent 40%, rgba(5,11,22,0.35) 100%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:linear-gradient(135deg, rgba(201,169,110,0.04) 0%, transparent 45%, transparent 55%, rgba(201,169,110,0.03) 100%);
}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:2px;}
.wrap{max-width:var(--max);margin:0 auto;padding:0 var(--px);position:relative;z-index:1;}
@media(max-width:768px){.wrap{padding:0 var(--pxm);}}

/* ANIMATIONS */
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:.78}50%{opacity:.78}}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
.r1{transition-delay:.1s}.r2{transition-delay:.2s}.r3{transition-delay:.3s}.r4{transition-delay:.4s}.r5{transition-delay:.5s}

/* NAV */
.nav{
  position:sticky;top:0;z-index:100;
  background:rgba(10,22,40,0.88);
  backdrop-filter:blur(18px) saturate(1.3);
  -webkit-backdrop-filter:blur(18px) saturate(1.3);
  border-bottom:1px solid var(--border);
  padding:12px 0;
  transition:background .28s ease,border-color .28s ease,backdrop-filter .28s ease;
}
.nav.scrolled{
  background:rgba(10,22,40,0.62);
  border-bottom-color:rgba(255,255,255,0.055);
  backdrop-filter:blur(20px) saturate(1.25);
  -webkit-backdrop-filter:blur(20px) saturate(1.25);
}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;}
.nav-back{
  display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:600;color:var(--muted);
  text-decoration:none;transition:color .2s;
  font-family:var(--fd);
}
.nav-back:hover{color:var(--gold);}
.nav-back svg{width:15px;height:15px;}
.nav-label{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.35);}

/* SECTION DIVIDERS */
.sdiv{height:1px;background:linear-gradient(90deg,transparent,rgba(184,149,106,0.22),transparent);border:none;margin:0;position:relative;z-index:1;}
.sdiv-strong{height:1px;background:linear-gradient(90deg,transparent,rgba(184,149,106,0.38),transparent);border:none;margin:0;position:relative;z-index:1;}

/* SECTIONS */
.sec{padding:96px 0;position:relative;z-index:1;}
.sec-alt{background:rgba(13,28,50,0.42);backdrop-filter:blur(2px);}
.sec-dark{background:rgba(17,30,53,0.52);backdrop-filter:blur(2px);}
.sec-dark::before{content:"";position:absolute;top:-100px;left:50%;transform:translateX(-50%);width:800px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(184,149,106,0.06) 0%,transparent 70%);pointer-events:none;}
@media(max-width:768px){.sec{padding:64px 0;}}

.stit{font-family:var(--fd);font-size:clamp(26px,3.5vw,48px);font-weight:800;color:var(--text);line-height:1.08;letter-spacing:-1.5px;}
.ssub{font-size:15px;color:var(--muted);margin-top:12px;max-width:520px;line-height:1.75;}
.stag{display:block;font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:2.8px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-size:14px;font-weight:700;padding:13px 26px;border-radius:var(--rs);text-decoration:none;border:none;cursor:pointer;transition:all .25s var(--ease);white-space:nowrap;position:relative;overflow:hidden;}
.btn::after{content:"";position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);transition:left .4s var(--ease);}
.btn:hover::after{left:150%;}
.btn svg{width:17px;height:17px;flex-shrink:0;}
.btn-green{background:var(--green);color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.22);}
.btn-green:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.30);}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{background:var(--gold);color:var(--bg);}
.btn-gold:hover{background:var(--gold2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.20);}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}

/* HERO */
.hero{position:relative;z-index:1;min-height:580px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden;}
.hero-left{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;padding:60px var(--px);background:linear-gradient(115deg,rgba(10,22,40,0.92) 55%,transparent 100%);}
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:26px;animation:fadeUp .7s .1s both;}
.eyebrow-dot{width:6px;height:6px;background:var(--gold);border-radius:50%;}
.hero-name{font-family:var(--fd);font-size:clamp(50px,5.5vw,86px);font-weight:900;line-height:.93;letter-spacing:-3px;color:var(--text);margin-bottom:20px;animation:fadeUp .7s .2s both;}
.hero-name em{color:var(--gold);font-style:normal;display:block;}
.hero-sub{font-size:clamp(13px,1.15vw,15px);color:var(--muted);max-width:440px;line-height:1.8;margin-bottom:38px;animation:fadeUp .7s .3s both;}
.hero-sub strong{color:var(--text);font-weight:600;}
.hero-metrics{display:flex;margin-bottom:44px;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;animation:fadeUp .7s .4s both;background:rgba(10,22,40,0.5);}
.hm{flex:1;padding:16px 20px;border-right:1px solid var(--border);}
.hm:last-child{border-right:none;}
.hm:first-child{background:var(--gd);}
.hm-val{font-family:var(--fd);font-size:clamp(18px,2.2vw,28px);font-weight:900;color:var(--text);line-height:1;letter-spacing:-1px;}
.hm-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.9px;font-weight:600;margin-top:4px;}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;animation:fadeUp .7s .5s both;}
.hero-right{position:relative;z-index:1;}
.hero-photo{position:absolute;inset:0;}
.hero-photo img{width:100%;height:100%;object-fit:cover;object-position:center 15%;filter:brightness(.93) contrast(1.04) saturate(1.06);display:block;}
.hero-photo::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,22,40,0.86) 0%,rgba(13,28,50,.18) 52%,transparent 100%);z-index:1;}
.hero-photo::after{content:"";position:absolute;bottom:0;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(10,22,40,0.78));z-index:1;}
.hero-quote{position:absolute;bottom:36px;right:36px;z-index:3;background:rgba(10,22,40,.80);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--bhi);border-radius:var(--r);padding:14px 20px;font-family:var(--fd);font-size:14px;font-weight:700;font-style:italic;color:var(--gold);animation:fadeIn 1s .7s both;}
.scroll-hint{position:absolute;bottom:30px;left:var(--px);display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;z-index:5;}
.scroll-hint-line{width:28px;height:1px;background:var(--border);}
@media(max-width:900px){
  .hero{grid-template-columns:1fr;min-height:auto;}
  .hero-right{height:62vw;min-height:300px;}
  .hero-photo{position:relative;height:100%;}
  .hero-photo::before{background:linear-gradient(180deg,transparent 40%,rgba(10,22,40,0.95) 100%);}
  .hero-left{order:2;padding:28px var(--pxm) 48px;background:transparent;}
  .hero-quote{bottom:18px;right:18px;font-size:12px;padding:10px 14px;}
  .hm{padding:10px 12px;}.scroll-hint{display:none;}
}

/* STATS */
.stats-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:360px 1fr;transition:box-shadow .4s;background:rgba(10,22,40,0.65);}
.stats-wrap:hover{box-shadow:0 20px 60px rgba(0,0,0,.45);}
.stat-hero{padding:32px;background:linear-gradient(135deg,rgba(184,149,106,0.12) 0%,rgba(10,22,40,0.85) 100%);border-right:1px solid var(--border);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;}
.stat-hero::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent);}
.stat-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--gg),transparent 70%);}
.sh-badge{display:inline-flex;align-items:center;gap:6px;width:fit-content;font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.3);padding:4px 10px;border-radius:var(--rp);margin-bottom:14px;}
.sh-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--gold);}
.sh-num{font-family:var(--fd);font-size:clamp(54px,5.8vw,80px);font-weight:900;color:var(--text);line-height:.95;letter-spacing:-3px;position:relative;z-index:1;}
.sh-unit{font-size:30px;color:var(--gold);letter-spacing:-1px;margin-left:2px;}
.sh-label{font-family:var(--fd);font-size:12px;color:var(--text);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:8px;}
.sh-period{font-size:11px;color:var(--muted);margin-top:2px;}

.stats-grid-cells{display:grid;grid-template-columns:repeat(3, 1fr);}
.stat-cell{padding:22px 24px;display:flex;flex-direction:column;justify-content:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);transition:background .2s;}
.stat-cell:nth-child(3n){border-right:none;}
.stat-cell:nth-last-child(-n+3){border-bottom:none;}
.stat-cell:hover{background:rgba(255,255,255,0.04);}
.sc-num{font-family:var(--fd);font-size:clamp(20px,2.2vw,30px);font-weight:900;color:var(--text);line-height:1.1;letter-spacing:-1px;margin-bottom:4px;}
.sc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;font-weight:600;}

.cta-strip{margin-top:24px;padding:18px 24px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;transition:border-color .25s;}
.cta-strip:hover{border-color:var(--bhi);}
.cta-strip-text{font-size:14px;color:var(--text);font-weight:500;}

/* PROOF */
.proof-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:26px;}
.proof-card{padding:22px 20px;background:rgba(10,22,40,.55);border:1px solid var(--border);border-radius:var(--r);position:relative;overflow:hidden;transition:border-color .25s,background .25s,transform .25s var(--ease);}
.proof-card::before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,var(--gold),transparent);opacity:.62;}
.proof-card:hover{border-color:var(--bhi);background:rgba(17,30,53,.68);transform:translateY(-2px);}
.proof-kicker{font-family:var(--fd);font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;}
.proof-title{font-family:var(--fd);font-size:18px;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:8px;}
.proof-desc{font-size:13px;color:var(--muted);line-height:1.72;}
@media(max-width:820px){.proof-grid{grid-template-columns:1fr;gap:10px;}.proof-card{padding:20px 18px;}}

@media(max-width:960px){
  .stats-wrap{grid-template-columns:1fr;}
  .stat-hero{border-right:none;border-bottom:1px solid var(--border);padding:28px 24px;}
  .stats-grid-cells{grid-template-columns:repeat(3, 1fr);}
  .stat-cell:nth-child(3n){border-right:none;}
  .stat-cell:nth-last-child(-n+3){border-bottom:none;}
}
@media(max-width:640px){
  .stats-grid-cells{grid-template-columns:1fr 1fr;}
  .stat-cell{padding:18px 16px;}
  .stat-cell:nth-child(odd){border-right:1px solid var(--border);}
  .stat-cell:nth-child(even){border-right:none;}
  .stat-cell:nth-last-child(-n+3){border-bottom:1px solid var(--border);}
  .stat-cell:nth-last-child(-n+2){border-bottom:none;}
}

/* VIDEOS */
.videos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.video-card{display:block;position:relative;border-radius:var(--r);overflow:hidden;background:rgba(17,30,53,0.85);text-decoration:none;transition:transform .4s var(--ease),box-shadow .4s;}
.video-card:hover{transform:translateY(-8px) scale(1.02);box-shadow:0 28px 64px rgba(0,0,0,.55);}
.video-thumb{aspect-ratio:9/16;overflow:hidden;}
.video-thumb img{width:100%;height:100%;object-fit:cover;object-position:center top;filter:brightness(.70);transition:transform .6s var(--ease),filter .3s;display:block;}
.video-card:hover .video-thumb img{transform:scale(1.08);filter:brightness(.85);}
.video-overlay{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,22,40,.92) 0%,rgba(0,0,0,.06) 50%,transparent 100%);display:flex;flex-direction:column;justify-content:space-between;padding:14px;}
.video-cat{display:inline-block;width:fit-content;font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--text);background:rgba(184,149,106,.16);border:1px solid var(--bhi);backdrop-filter:blur(8px);padding:4px 10px;border-radius:var(--rp);}
.video-play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;transition:all .25s;}
.video-card:hover .video-play-btn{background:var(--gold);border-color:var(--gold);transform:translate(-50%,-50%) scale(1.12);}
.video-play-btn svg{fill:white;width:16px;height:16px;margin-left:3px;}
.video-views{font-size:11px;color:rgba(255,255,255,.6);margin-bottom:3px;}
.video-title{font-family:var(--fd);font-size:13px;font-weight:700;color:#fff;line-height:1.3;}
@media(max-width:768px){.videos-grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}.videos-grid::-webkit-scrollbar{display:none;}.video-card{min-width:175px;scroll-snap-align:start;flex-shrink:0;}}

/* AUDIENCE */
.audience-grid{display:grid;grid-template-columns:260px 1fr 1fr;gap:56px;align-items:start;}
.donut-title,.bars-title{font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:24px;}
.donut-wrap{position:relative;width:180px;height:180px;margin-bottom:20px;}
.donut-wrap svg{transform:rotate(-90deg);overflow:visible;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.dc-val{font-family:var(--fd);font-size:28px;font-weight:900;color:var(--gold);line-height:1;}
.dc-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.donut-legend-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.donut-legend-item:last-child{border-bottom:none;}
.dll-left{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
.dll-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dll-pct{font-family:var(--fd);font-size:15px;font-weight:700;color:var(--text);}
.bar-row{margin-bottom:16px;}
.bar-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.bar-lbl{font-size:13px;color:var(--text);font-weight:500;}
.bar-pct{font-family:var(--fd);font-size:14px;font-weight:700;color:var(--gold);}
.bar-track{height:4px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--rose));width:0%;transition:width 1.4s var(--ease);}
.audience-insight{margin-top:24px;padding:16px 18px;background:var(--gd);border:1px solid var(--bhi);border-radius:var(--rs);font-size:13px;color:var(--muted);line-height:1.75;}
@media(max-width:1024px){.audience-grid{grid-template-columns:1fr 1fr;gap:36px;}.donut-col{grid-column:1/-1;display:flex;gap:36px;align-items:start;}}
@media(max-width:600px){.audience-grid{grid-template-columns:1fr;}.donut-col{flex-direction:column;}}

/* NICHES */
.niches-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;}
.niche-card{
  min-height:118px;padding:20px 16px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(29,49,86,0.82);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:14px;text-align:center;
  transition:transform .25s var(--ease),border-color .25s,background .25s;
}
.niche-card:hover{transform:translateY(-2px);border-color:rgba(201,169,110,0.30);background:rgba(33,54,93,0.88);}
.niche-icon{height:32px;display:flex;align-items:center;justify-content:center;color:var(--gold);}
.niche-icon svg{width:25px;height:25px;stroke-width:1.8;}
.niche-label{font-family:var(--fd);font-size:14px;font-weight:600;color:#AAB8CD;line-height:1.25;}
@media(max-width:1100px){.niches-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(max-width:640px){.niches-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}.niche-card{min-height:104px;padding:16px 12px;}.niche-label{font-size:13px;}}

/* DIFFERENTIALS */
.diff-layout{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;}
.diff-list{list-style:none;}
.diff-item{display:flex;gap:14px;padding:16px 10px;border-bottom:1px solid var(--border);transition:background .2s;border-radius:var(--rs);}
.diff-item:first-child{padding-top:0;}.diff-item:last-child{border-bottom:none;padding-bottom:0;}
.diff-item:hover{background:rgba(255,255,255,0.03);}
.diff-icon{width:22px;height:22px;border-radius:50%;background:var(--gd);border:1px solid var(--bhi);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.diff-icon svg{width:11px;height:11px;}
.diff-body{font-size:14px;color:var(--muted);line-height:1.7;}
.diff-body strong{display:block;color:var(--text);font-weight:600;margin-bottom:2px;}
.diff-callout{background:var(--gd);border:1px solid var(--bhi);border-radius:var(--r);padding:40px 36px;position:relative;overflow:hidden;}
.diff-callout::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.dc-quote{font-family:var(--fd);font-size:clamp(18px,2.5vw,28px);font-weight:800;color:var(--text);line-height:1.3;letter-spacing:-.5px;margin-bottom:14px;}
.dc-quote em{color:var(--gold);font-style:normal;}
.dc-sub{font-size:14px;color:var(--muted);line-height:1.78;margin-bottom:28px;}
@media(max-width:768px){.diff-layout{grid-template-columns:1fr;gap:36px;}}

/* PROCESS / COMO FUNCIONA (VIBRANT ALIVE CARDS) */
.steps-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  position:relative;
}
.step-card{
  position:relative;
  background:linear-gradient(180deg,rgba(26,42,74,0.65) 0%,rgba(13,28,50,0.85) 100%);
  border:1px solid rgba(255,255,255,0.10);
  border-radius:var(--r);
  padding:28px 22px 26px;
  overflow:hidden;
  transition:all .35s var(--ease);
  display:flex;
  flex-direction:column;
  box-shadow:0 8px 24px rgba(0,0,0,0.25);
}
.step-card::before{
  content:"";position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,rgba(201,169,110,0.7),transparent);
  opacity:0;transition:opacity .35s;
}
.step-card:hover{
  transform:translateY(-4px);
  border-color:rgba(201,169,110,0.45);
  box-shadow:0 16px 36px rgba(0,0,0,0.38);
  background:linear-gradient(180deg,rgba(32,52,90,0.75) 0%,rgba(16,34,60,0.92) 100%);
}
.step-card:hover::before{opacity:1;}
.sc-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:20px;
}
.sc-number-pill{
  font-family:var(--fd);font-size:11px;font-weight:800;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--gold);
  background:rgba(201,169,110,0.14);border:1px solid rgba(201,169,110,0.35);
  padding:4px 12px;border-radius:var(--rp);
}
.sc-icon{
  font-size:22px;width:42px;height:42px;border-radius:12px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
  display:flex;align-items:center;justify-content:center;
  transition:all .3s var(--ease);
}
.step-card:hover .sc-icon{
  background:var(--gd);border-color:var(--bhi);transform:scale(1.1);
}
.sc-watermark{
  position:absolute;right:14px;bottom:6px;
  font-family:var(--fd);font-size:62px;font-weight:900;line-height:1;
  letter-spacing:-2px;color:rgba(255,255,255,.045);
  pointer-events:none;user-select:none;transition:all .3s var(--ease);
}
.step-card:hover .sc-watermark{
  color:rgba(201,169,110,.12);
  transform:scale(1.05);
}
.sc-title{
  font-family:var(--fd);font-size:17px;font-weight:700;color:#FFFFFF;
  margin-bottom:8px;letter-spacing:-0.3px;position:relative;z-index:1;
}
.sc-desc{
  font-size:13px;color:var(--muted);line-height:1.72;position:relative;z-index:1;
}
@media(max-width:960px){
  .steps-grid{grid-template-columns:1fr 1fr;gap:14px;}
}
@media(max-width:540px){
  .steps-grid{grid-template-columns:1fr;}
}

/* SERVICES (CLEAN TWO-ROW STRUCTURE, NO COLLISION) */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.service-card{
  padding:28px 24px;background:rgba(255,255,255,0.03);border:1px solid var(--border);
  border-radius:var(--r);position:relative;overflow:hidden;transition:all .35s var(--ease);
  display:flex;flex-direction:column;
}
.service-card::after{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .3s;}
.service-card:hover{border-color:var(--bhi);transform:translateY(-5px);box-shadow:0 20px 48px rgba(0,0,0,.38);background:rgba(255,255,255,0.05);}
.service-card:hover::after{opacity:1;}
.svc-icon{width:42px;height:42px;border-radius:12px;background:var(--gd);border:1px solid var(--bhi);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--gold);}
.svc-icon svg{width:20px;height:20px;}
.svc-name{font-family:var(--fd);font-size:17px;font-weight:700;color:var(--text);margin-bottom:8px;}
.svc-desc{font-size:13px;color:var(--muted);line-height:1.72;margin-bottom:22px;flex-grow:1;}
.svc-footer{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding-top:16px;border-top:1px solid rgba(255,255,255,0.06);margin-top:auto;
}
.svc-badge{
  display:inline-flex;align-items:center;
  font-size:11px;font-weight:600;color:var(--gold);
  background:var(--gd);border:1px solid var(--bhi);
  padding:4px 10px;border-radius:var(--rp);letter-spacing:.3px;
}
.svc-cta{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--fd);font-size:13px;font-weight:700;
  color:var(--text);text-decoration:none;transition:color .2s,gap .2s;
}
.svc-cta:hover{color:var(--gold);gap:9px;}
.svc-cta svg{width:13px;height:13px;}
@media(max-width:1024px){.services-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.services-grid{grid-template-columns:1fr;}}

/* PACKAGES (NO DASHES, GLOWING GOLD DOT BULLETS) */
.packages-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
.pkg-card{padding:32px 26px;background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r);transition:border-color .25s,transform .25s var(--ease),box-shadow .25s;}
.pkg-card:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(0,0,0,.3);}
.pkg-card.featured{background:var(--gd);border-color:var(--gold);}
.pkg-badge{display:inline-block;font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--bg);background:var(--gold);padding:4px 12px;border-radius:var(--rp);margin-bottom:18px;}
.pkg-spacer{height:26px;margin-bottom:18px;}
.pkg-name{font-family:var(--fd);font-size:24px;font-weight:900;color:var(--text);letter-spacing:-1px;margin-bottom:5px;}
.pkg-tagline{font-size:13px;color:var(--muted);margin-bottom:20px;}
.pkg-div{height:1px;background:var(--border);margin-bottom:18px;}
.pkg-list{list-style:none;margin-bottom:26px;}
.pkg-list li{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--border);line-height:1.5;}
.pkg-list li:last-child{border-bottom:none;padding-bottom:0;}
.pkg-list li::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);
  flex-shrink:0;
}
.pkg-btn{display:block;width:100%;padding:13px;border-radius:var(--rs);font-family:var(--fd);font-size:14px;font-weight:700;text-align:center;text-decoration:none;border:1px solid var(--border);color:var(--text);background:transparent;transition:all .25s;cursor:pointer;}
.pkg-btn:hover{border-color:var(--gold);color:var(--gold);}
.pkg-card.featured .pkg-btn{background:var(--gold);color:var(--bg);border-color:var(--gold);}
.pkg-card.featured .pkg-btn:hover{background:var(--gold2);box-shadow:0 8px 24px rgba(0,0,0,.22);}
@media(max-width:768px){.packages-grid{grid-template-columns:1fr;}}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;}
.about-photo-wrap{position:relative;border-radius:var(--r);overflow:hidden;}
.about-photo-wrap img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;display:block;transition:transform .5s var(--ease);}
.about-photo-wrap:hover img{transform:scale(1.03);}
.about-photo-grad{position:absolute;inset:0;background:linear-gradient(0deg,rgba(17,28,51,.7) 0%,transparent 60%);}
.about-photo-tag{position:absolute;bottom:20px;left:20px;right:20px;padding:13px 17px;background:rgba(10,22,40,.80);backdrop-filter:blur(16px);border:1px solid var(--bhi);border-radius:var(--rs);font-family:var(--fd);font-size:14px;font-weight:700;font-style:italic;color:var(--gold);}
.about-highlight{font-family:var(--fd);font-size:clamp(15px,1.7vw,20px);font-weight:700;color:var(--text);line-height:1.4;padding:18px 18px 18px 16px;background:var(--gd);border-left:3px solid var(--gold);border-radius:0 var(--rs) var(--rs) 0;margin-bottom:22px;}
.about-p{font-size:14px;color:var(--muted);line-height:1.85;margin-bottom:14px;}
.about-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.about-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:var(--rp);padding:5px 12px;}
.about-tag svg{width:12px;height:12px;color:var(--gold);}
@media(max-width:768px){.about-grid{grid-template-columns:1fr;gap:32px;}}

/* CTA FINAL */
.cta-final{padding:72px 0;text-align:center;position:relative;overflow:hidden;}
.cta-final::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(184,149,106,0.08) 0%,transparent 70%);pointer-events:none;}
.cta-f-title{font-family:var(--fd);font-size:clamp(30px,5.5vw,70px);font-weight:900;color:var(--text);line-height:1.04;letter-spacing:-2.5px;margin-bottom:14px;}
.cta-f-title em{color:var(--gold);font-style:normal;}
.cta-f-sub{font-size:15px;color:var(--muted);max-width:400px;margin:0 auto 32px;line-height:1.75;}
.cta-f-btns{display:flex;gap:11px;justify-content:center;flex-wrap:wrap;}

/* CONTACT BAR */
.contact-bar{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:rgba(10,22,40,0.5);}
.contact-item{flex:1;display:flex;align-items:center;gap:12px;padding:20px 24px;text-decoration:none;transition:background .2s;border-right:1px solid var(--border);color:inherit;}
.contact-item:last-child{border-right:none;}
.contact-item:hover{background:var(--gd);}
.ci-icon{flex-shrink:0;display:flex;align-items:center;}
.ci-icon svg{width:19px;height:19px;}
.ci-type{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1.1px;font-weight:700;margin-bottom:2px;}
.ci-val{font-size:13px;color:var(--text);font-weight:500;}
@media(max-width:768px){.contact-bar{flex-direction:column;}.contact-item{border-right:none;border-bottom:1px solid var(--border);}.contact-item:last-child{border-bottom:none;}}

/* FOOTER & AVANCINI DASH CREDIT */
.footer{padding:24px 0;border-top:1px solid var(--border);position:relative;z-index:1;background:rgba(10,22,40,0.75);}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.footer-copy{font-size:12px;color:var(--dim);letter-spacing:.4px;}
.footer-copy a{color:var(--gold);text-decoration:none;font-weight:600;}
.footer-copy a:hover{text-decoration:underline;}
.footer-credit{display:flex;align-items:center;gap:5px;}
.av-pre{font-family:var(--fb);font-size:11px;color:rgba(255,255,255,0.25);}
.avancini-badge{
  display:inline-flex;align-items:center;
  text-decoration:none;font-family:var(--fb);font-size:11px;
  color:rgba(255,255,255,0.42);font-weight:600;
  transition:color .2s;border-bottom:1px solid rgba(255,255,255,0.15);
  padding-bottom:1px;
}
.avancini-badge:hover{color:rgba(255,255,255,0.7);border-bottom-color:rgba(255,255,255,0.35);}
@media(max-width:640px){
  .footer-inner{flex-direction:column;align-items:center;text-align:center;gap:12px;}
}

/* WA FLOAT */
.wa-float{position:fixed;bottom:24px;right:22px;z-index:9997;display:flex;align-items:center;gap:8px;font-family:var(--fd);font-size:13px;font-weight:700;color:#fff;background:var(--green);border-radius:var(--rp);padding:12px 20px;text-decoration:none;box-shadow:0 10px 26px rgba(0,0,0,.30);opacity:0;transform:translateY(14px);transition:opacity .3s,transform .3s var(--ease),box-shadow .25s;pointer-events:none;}
.wa-float::before{display:none;}
@keyframes wap{0%{transform:scale(1);opacity:.3;}100%{transform:scale(1.5);opacity:0;}}
.wa-float.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
.wa-float:hover{box-shadow:0 14px 34px rgba(0,0,0,.38);transform:translateY(-2px);}
.wa-float svg{width:17px;height:17px;flex-shrink:0;}
@media(max-width:600px){.wa-float{bottom:16px;right:16px;padding:10px 16px;font-size:12px;}}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1!important;transform:none!important;transition:none!important;}.wa-float::before{display:none;}}


/* =========================================================
   REFINOS V5 — AJUSTES LEVES, HERO MAIS VIVO E MOBILE REAL
   ========================================================= */

/* O fundo/textura vira a base visual de toda a página. */
body{background-position:center top;}
.nav,.footer{background-color:rgba(10,22,40,.64);}

/* Crédito discreto e footer com acabamento mais profissional. */
.footer{
  padding:20px 0 calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07);
  box-shadow:0 -14px 34px rgba(0,0,0,.12);
}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;}
.footer-copy{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:rgba(240,242,245,.46);}
.footer-copy strong{font-weight:600;color:rgba(240,242,245,.68);}
.footer-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:11px;}
.footer-site{color:var(--gold);text-decoration:none;font-weight:600;}
.footer-site:hover{text-decoration:underline;}
.footer-sep{color:rgba(255,255,255,.18);}
.footer-credit{display:inline-flex;align-items:center;gap:5px;color:rgba(255,255,255,.34);white-space:nowrap;}
.avancini-badge{color:rgba(255,255,255,.58);border-bottom:1px solid rgba(201,169,110,.24);text-decoration:none;padding-bottom:1px;}
.avancini-badge:hover{color:var(--gold2);border-bottom-color:var(--gold);}

/* WhatsApp: fica visível no celular e nunca some atrás do rodapé. */
.wa-float{bottom:calc(24px + env(safe-area-inset-bottom));right:24px;}
.wa-float.near-footer{bottom:84px;}

/* Etapas: um pouco mais de vida sem transformar os cards em brinquedo. */
.step-card{--step-accent:var(--gold);}
.step-card:nth-child(2){--step-accent:var(--rose);}
.step-card:nth-child(3){--step-accent:#50C878;}
.step-card:nth-child(4){--step-accent:var(--gold2);}
.sc-icon{
  position:relative;color:var(--step-accent);
  background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));
  border-color:color-mix(in srgb,var(--step-accent) 34%,transparent);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.025),0 8px 20px rgba(0,0,0,.16);
}
.sc-icon svg{width:22px;height:22px;stroke-width:2.15;}
.sc-icon::after{content:"";position:absolute;right:6px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--step-accent);opacity:.72;}
.step-card:hover .sc-icon{color:var(--step-accent);background:color-mix(in srgb,var(--step-accent) 12%,rgba(255,255,255,.04));border-color:color-mix(in srgb,var(--step-accent) 44%,transparent);transform:translateY(-2px) scale(1.035);}
.sc-number-pill{box-shadow:none;}

/* Evita estouro de conteúdo em qualquer largura. */
.hero-left,.hero-right,.audience-grid>*,.contact-item>*,.service-card,.pkg-card{min-width:0;}
.ci-val,.footer-copy,.about-p,.svc-desc,.pkg-list li{overflow-wrap:anywhere;}
.contact-item{min-width:0;}

(function(){
  function animateCounter(el,delay){
    if(!el || el.dataset.counted)return;
    el.dataset.counted="1";
    var unit=el.querySelector(".sh-unit");
    var source=(unit?((el.childNodes[0]&&el.childNodes[0].nodeValue)||"")+unit.textContent:el.textContent).trim();
    var prefix=source.charAt(0)==="+"?"+":"";
    var suffix=unit?unit.textContent:(source.indexOf("%")>-1?"%":"");
    var target=parseInt(source.replace(/\D/g,""),10);
    if(!target)return;
    var format=new Intl.NumberFormat("pt-BR");
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function paint(value){
      var text=prefix+format.format(value);
      if(unit){
        if(el.childNodes[0])el.childNodes[0].nodeValue=text;
        else el.insertBefore(document.createTextNode(text),unit);
      }else{
        el.textContent=text+suffix;
      }
    }
    if(reduce){paint(target);return;}
    paint(0);
    setTimeout(function(){
      var start=performance.now(),duration=920;
      function step(now){
        var p=Math.min((now-start)/duration,1);
        var eased=1-Math.pow(1-p,3);
        paint(Math.round(target*eased));
        if(p<1)requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    },delay||0);
  }
  function animateStats(box){
    box.querySelectorAll(".sh-num,.sc-num").forEach(function(el,i){animateCounter(el,120+i*80);});
  }
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");if(e.target.classList.contains("stats-wrap"))animateStats(e.target);io.unobserve(e.target);}});},{threshold:0.1,rootMargin:"0px 0px -30px 0px"});
  document.querySelectorAll(".reveal").forEach(function(el){io.observe(el);});
  var ao=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.querySelectorAll(".bar-fill").forEach(function(b,i){setTimeout(function(){b.style.width=b.dataset.w+"%";},180+i*110);});ao.unobserve(e.target);}});},{threshold:0.15});
  var ag=document.querySelector(".audience-grid");if(ag)ao.observe(ag);
  var waf=document.getElementById("waf");
  waf.href="https://wa.me/"+D.whatsapp+"?text="+encodeURIComponent(D.waGeneral);
  var nav=document.querySelector(".nav");
  function syncScrollUI(){
    var isMobile=window.matchMedia("(max-width: 768px)").matches;
    if(isMobile || window.scrollY>260)waf.classList.add("visible");else waf.classList.remove("visible");
    if(nav){if(window.scrollY>20)nav.classList.add("scrolled");else nav.classList.remove("scrolled");}
  }
  syncScrollUI();
  window.addEventListener("scroll",syncScrollUI,{passive:true});
  window.addEventListener("resize",syncScrollUI,{passive:true});

  /* Evita o botão flutuante cobrir os créditos/rodapé. */
  var footer=document.querySelector(".footer");
  if(footer && "IntersectionObserver" in window){
    var fio=new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        waf.classList.toggle("near-footer",entry.isIntersecting);
      });
    },{threshold:0.08});
    fio.observe(footer);
  }
})();
