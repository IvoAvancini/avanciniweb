      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Background plate -->
  <rect width="64" height="64" rx="14" fill="#030712" />
  <rect width="64" height="64" rx="14" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <!-- Avancini Mark Facets -->
  <polygon points="26.6,11 38,11 36.9,16 28.4,16" fill="url(#capGrad)" />
  <polygon points="27,11 37,11 24,50 11,50" fill="url(#leftGrad)" />
  <polygon points="26,11 36.8,11 53,50 42.2,50 30.6,27.8" fill="url(#rightGrad)" />
  <polygon points="31,35 39,35 44,50 40.3,50" fill="url(#notchGrad)" />
  <!-- White Slash -->
  <polygon points="11,50 17.2,50 51,16 11,45.8" fill="url(#slashGrad)" filter="url(#slashGlow)" />
