<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="capGrad" x1="26" y1="11" x2="38" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="11" y1="11" x2="37" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="75%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#022c14" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="26" y1="11" x2="53" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="42%" stop-color="#38bdf8" />
      <stop offset="76%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#032338" />
    </linearGradient>
    <linearGradient id="notchGrad" x1="31" y1="35" x2="44" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#022030" />
    </linearGradient>
    <linearGradient id="slashGrad" x1="11" y1="50" x2="51" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="slashGlow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
