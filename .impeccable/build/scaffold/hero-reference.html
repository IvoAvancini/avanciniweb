<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: atlas-02.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#e8e7d9}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-paper-texture region texture" data-region="paper-texture" style="background-image:url('../../../assets/plates/paper-texture.png');background-repeat:repeat"></div>
  <div class="r-header-rule region chrome" data-region="header-rule"><!-- compact header with a thin black bottom rule --></div>
  <div class="r-brand region text" data-region="brand"><!-- AVANCINI OS wordmark --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-header-nav region text" data-region="header-nav"><!-- ESTÚDIO PROJETOS SERVIÇOS CONTATO navigation --><p style="font-size:var(--r-header-nav-font);line-height:1.05;margin:0">header-nav</p></div>
  <div class="r-menu-control region control" data-region="menu-control"><!-- MENU label and two-line menu icon: rebuild the control's chrome from the crop (comp-spec.mjs --crop menu-control); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-studio-note region text" data-region="studio-note"><!-- small studio positioning note --><p style="font-size:var(--r-studio-note-font);line-height:1.05;margin:0">studio-note</p></div>
  <div class="r-coordinates region text" data-region="coordinates"><!-- Brasil coordinate note --><p style="font-size:var(--r-coordinates-font);line-height:1.05;margin:0">coordinates</p></div>
  <div class="r-movement-note region text" data-region="movement-note"><!-- small ideas em movimento note --><p style="line-height:1.05;margin:0">movement-note</p></div>
  <div class="r-hero-headline region text" data-region="hero-headline"><!-- large editorial headline Ideias que encontram direção. Tecnologia que faz avançar. --><p style="font-size:var(--r-hero-headline-font);font-family:var(--r-hero-headline-family),sans-serif;font-weight:var(--r-hero-headline-weight);line-height:1.05;margin:0">hero-headline</p></div>
  <figure class="r-project-photo region plate" data-region="project-photo"><img src="../../../assets/plates/project-photo.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-project-label region text" data-region="project-label"><!-- PROJETO REAL — TAPE CAR text label positioned above the project image --><p style="line-height:1.05;margin:0">project-label</p></div>
  <div class="r-project-side-note region text" data-region="project-side-note"><!-- small movement inteligente para pessoas reais note --><p style="line-height:1.05;margin:0">project-side-note</p></div>
  <div class="r-route-left region chrome" data-region="route-left"><!-- thin cobalt route line with circular nodes --></div>
  <div class="r-route-right region chrome" data-region="route-right"><!-- continuation of thin cobalt route line across the project image --></div>
  <div class="r-route-labels region text" data-region="route-labels"><!-- IDENTIDADE EXPERIÊNCIA AUTOMAÇÃO SISTEMAS route labels --><p style="line-height:1.05;margin:0">route-labels</p></div>
  <div class="r-primary-action region control" data-region="primary-action"><!-- lime rectangular COMEÇAR UM PROJETO button with arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop primary-action); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-bottom-values region text" data-region="bottom-values"><!-- small IDEIAS SISTEMAS PESSOAS RESULTADOS stack --><p style="font-size:var(--r-bottom-values-font);line-height:1.05;margin:0">bottom-values</p></div>
  <div class="r-bottom-method region text" data-region="bottom-method"><!-- small DO PLANEJAMENTO À OPERAÇÃO COM PROPÓSITO note --><p style="font-size:var(--r-bottom-method-font);line-height:1.05;margin:0">bottom-method</p></div>
  <div class="r-project-metadata region text" data-region="project-metadata"><!-- small PROJETO REAL TAPE CAR coordinate metadata --><p style="line-height:1.05;margin:0">project-metadata</p></div>
  <div class="r-contour-texture region texture" data-region="contour-texture" style="background-image:url('../../../assets/plates/contour-texture.png');background-repeat:repeat"></div>
  <div class="r-next-section-index region text" data-region="next-section-index"><!-- 02 PRÓXIMO CAPÍTULO index --><p style="line-height:1.05;margin:0">next-section-index</p></div>
  <div class="r-next-section-heading region text" data-region="next-section-heading"><!-- cropped large Projetos que heading beginning next section --><p style="font-size:var(--r-next-section-heading-font);line-height:1.05;margin:0">next-section-heading</p></div>
  <figure class="r-next-project-plate region plate" data-region="next-project-plate"><img src="../../../assets/plates/next-project-plate.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-next-section-note region text" data-region="next-section-note"><!-- small MESMA DIREÇÃO MAIS POSSIBILIDADES note --><p style="line-height:1.05;margin:0">next-section-note</p></div>
</main>
</body>
</html>
